name: Build Android APK with Capacitor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capacitor-apk.yml'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icon-192.png'
      - 'icon-512.png'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the app
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare Capacitor project
        shell: bash
        run: |
          mkdir -p mobile/www
          cp index.html manifest.json sw.js icon-192.png icon-512.png mobile/www/
          cat > mobile/package.json <<'EOF'
          {
            "name": "mokato-sales-capacitor",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^8.0.0",
              "@capacitor/core": "^8.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^8.0.0"
            }
          }
          EOF
          cat > mobile/capacitor.config.json <<'EOF'
          {
            "appId": "com.mokato.sales",
            "appName": "مبيعات موكاتو",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm install

      - name: Generate Android project
        working-directory: mobile
        run: npx cap add android

      - name: Sync web app into Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mokato-sales-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
