<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فواتير موكاتو</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ece2;--surface:#fffaf3;--ink:#2b1a12;--muted:#7a6454;--line:#dccdb8;--accent:#6b3a1f;--onaccent:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b110c;--surface:#271a13;--ink:#f1e6d8;--muted:#b09a85;--line:#443226;--accent:#c98a55;--onaccent:#1b110c}}
:root[data-theme="dark"]{--bg:#1b110c;--surface:#271a13;--ink:#f1e6d8;--muted:#b09a85;--line:#443226;--accent:#c98a55;--onaccent:#1b110c}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;line-height:1.6}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;font-weight:800;margin:4px 0 14px}
h2{font-size:1rem;font-weight:600;margin:18px 0 8px;color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:2px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:8px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.row input{margin-bottom:0;padding:9px 8px;min-width:0}
.row .rn{grid-column:span 5}.row .rr,.row .rq,.row .rp{grid-column:span 2}.row .del{grid-column:span 1}
.del{height:100%;min-height:40px;border:1px solid var(--line);background:none;color:var(--muted);border-radius:8px;font-size:1.1rem}
button.main{width:100%;font:inherit;font-weight:800;font-size:1.05rem;background:var(--accent);color:var(--onaccent);border:0;border-radius:10px;padding:13px;margin-top:14px}
button.alt{font:inherit;font-weight:600;background:none;color:var(--accent);border:1px dashed var(--accent);border-radius:8px;padding:8px 12px;width:100%}
.scroll{overflow-x:auto;padding:4px 0}
#inv{width:320px;margin:0 auto;background:#fff;color:#1a1a1a;padding:18px 16px 20px;font-family:Cairo,Tahoma,sans-serif;box-shadow:0 1px 6px rgba(0,0,0,.15)}
#inv .logo{display:block;width:150px;margin:0 auto 4px}
#inv .c{text-align:center}
#inv .sm{font-size:.78rem;color:#555}
#inv .dash{border-top:2px dashed #999;margin:10px 0}
#inv .meta{display:flex;justify-content:space-between;font-size:.82rem;padding:1px 0}
#inv table{width:100%;border-collapse:collapse;font-size:.82rem;table-layout:fixed}
#inv .hd th{border-bottom:1px dashed #999;padding-bottom:4px}
#inv th{text-align:right;font-weight:800;padding:3px 0}
#inv td{padding:4px 0;vertical-align:top}
#inv .n{text-align:center;white-space:nowrap}
#inv .tot div{display:flex;justify-content:space-between;padding:2px 0;font-size:.88rem}
#inv .grand{font-weight:800;font-size:1.2rem!important;border-top:2px solid #1a1a1a;border-bottom:2px solid #1a1a1a;margin:6px 0;padding:5px 0!important}
#inv .rem{font-weight:800;font-size:1rem!important}
#inv .bar{height:34px;margin:8px 18px 4px;background:repeating-linear-gradient(90deg,#1a1a1a 0 2px,#fff 2px 4px,#1a1a1a 4px 5px,#fff 5px 8px,#1a1a1a 8px 11px,#fff 11px 13px)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;flex-direction:column;align-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto;z-index:9}
#modal.on{display:flex}
#modal img{-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;max-width:100%;width:380px;border-radius:6px;background:#fff}
#modal p{color:#fff;font-size:.9rem;margin:10px 0 0;text-align:center}
#modal .btns{display:flex;gap:8px;width:100%;max-width:380px;margin-top:10px}
#modal .btns button{flex:1;margin-top:0}
.hitem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.hitem:last-child{border-bottom:0}
.hitem .meta{flex:1;min-width:0}
.hitem .meta b{display:block}
.hitem .meta span{font-size:.8rem;color:var(--muted)}
.hitem .acts{display:flex;gap:6px}
.hitem .acts button{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 10px;font-size:.85rem}
.hempty{color:var(--muted);text-align:center;padding:18px 0}
</style>
</head>
<body>
<main id="formView">
<div style="display:flex;justify-content:space-between;align-items:center">
  <h1 style="margin:0">فاتورة جديدة</h1>
  <button class="alt" id="histBtn" type="button" style="width:auto;padding:8px 14px;margin:4px 0">سجل الفواتير</button>
</div>

<div id="oldBanner" class="box" style="display:none;margin-top:8px"><span>فاتورة محفوظة رقم <b id="oldNo"></b> — تقدر تعمل صورتها تاني.</span><button class="alt" id="newInv" type="button" style="margin-top:6px">ابدأ فاتورة جديدة</button></div>
<h2>العميل</h2>
<div class="box">
  <div class="two">
    <div><label for="cn">اسم العميل</label><input id="cn" placeholder="مثال: كافيه النيل"></div>
    <div><label for="cp">تليفون العميل</label><input id="cp" inputmode="tel"></div>
  </div>
  <label for="dt">التاريخ</label><input id="dt" type="date">
</div>

<h2>الأصناف</h2>
<div class="box">
  <datalist id="dn"><option value="سوبر موكاتو سادة"><option value="سوبر محوج موكاتو"><option value="توليفة موكاتو"><option value="قهوة فرنسية"><option value="اسبريسو سوبر كريمة 70/30"></datalist>
  <datalist id="dr"><option value="فاتح"><option value="وسط"><option value="غامق"><option value="بندق"><option value="لوتس"><option value="تشكليس فراولة"><option value="شيشة تفاح"><option value="توكلت"></datalist>
  <div id="rows"></div>
  <button class="alt" id="add" type="button">+ أضف صنف</button>
  <div class="two" style="margin-top:10px">
    <div><label for="ds">خصم (ج.م)</label><input id="ds" type="number" inputmode="decimal" min="0" value="0"></div>
    <div><label for="pd">المدفوع (ج.م)</label><input id="pd" type="number" inputmode="decimal" min="0" value="0"></div>
  </div>
</div>

<h2>المعاينة</h2>
<div class="scroll"><div id="inv"></div></div>

<button class="main" id="make" type="button">اعمل صورة الفاتورة</button>
</main>

<div id="histView" style="display:none">
  <main>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h1 style="margin:0">سجل الفواتير</h1>
      <button class="alt" id="histClose" type="button" style="width:auto;padding:8px 14px;margin:4px 0">رجوع</button>
    </div>
    <div id="histList" class="box" style="margin-top:10px"></div>
  </main>
</div>

<div id="modal">
  <img id="out" alt="صورة الفاتورة">
  <p id="smsg">اضغط مطولًا على الصورة لحفظها لو زر الحفظ مفتحش</p>
  <div class="btns">
    <button class="main" id="share" type="button">حفظ الصورة</button>
    <button class="alt" id="share2" type="button">مشاركة</button>
    <button class="alt" id="close" type="button">إغلاق</button>
  </div>
</div>

$('dt').value=new Date().toISOString().slice(0,10);

function addRow(name='',roast='',qty='',price=''){
  const d=document.createElement('div');d.className='row';
  d.innerHTML='<input class="rn" list="dn" placeholder="اسم الصنف" value="'+esc(name)+'" aria-label="اسم الصنف">'+
  '<button class="del" type="button" aria-label="احذف الصنف">×</button>'+
  '<input class="rr" list="dr" placeholder="التحميص / الطعم" value="'+esc(roast)+'" aria-label="درجة التحميص أو الطعم">'+
  '<input class="rq" type="number" inputmode="decimal" min="0" step="any" placeholder="الكمية (كجم)" value="'+qty+'" aria-label="الكمية">'+
  '<input class="rp" type="number" inputmode="decimal" min="0" step="any" placeholder="السعر للكيلو" value="'+price+'" aria-label="السعر">';
  d.querySelector('.del').onclick=()=>{d.remove();draw()};
  $('rows').appendChild(d);
}
const PR={'سوبر موكاتو سادة':540,'سوبر محوج موكاتو':640,'قهوة فرنسية':580,'اسبريسو سوبر كريمة 70/30':650};
$('rows').addEventListener('change',e=>{
  if(e.target.classList.contains('rn')&&PR[e.target.value]){
    const p=e.target.closest('.row').querySelector('.rp');
    if(!p.value){p.value=PR[e.target.value];draw()}
  }
});
function items(){
  return [...document.querySelectorAll('.row')].map(r=>({
    n:r.querySelector('.rn').value.trim(),
    r:r.querySelector('.rr').value.trim(),
    q:parseFloat(r.querySelector('.rq').value)||0,
    p:parseFloat(r.querySelector('.rp').value)||0
  })).filter(i=>i.n||i.q||i.p);
}
function invNo(){return parseInt(store.get('mk_no2','99'),10)+1}
function draw(){
  const it=items();
  const sub=it.reduce((s,i)=>s+i.q*i.p,0);
  const ds=parseFloat($('ds').value)||0, pd=parseFloat($('pd').value)||0;
  const total=Math.max(sub-ds,0), rem=total-pd;
  const d=$('dt').value?new Date($('dt').value+'T00:00:00').toLocaleDateString('en-GB'):'';
  const tm=showTm||new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  const rows=it.length?it.map(i=>'<tr><td>'+esc(i.n||'—')+(i.r?'<div class="sm">'+esc(i.r)+'</div>':'')+'</td><td class="n">'+fmt(i.q)+'</td><td class="n">'+fmt(i.p)+'</td><td class="n">'+fmt(i.q*i.p)+'</td></tr>').join(''):'<tr><td colspan="4" class="sm c" style="padding:14px 0">أضف أصناف الفاتورة</td></tr>';
  $('inv').innerHTML=
  '<img class="logo" src="'+LOGO+'" alt="موكاتو">'+
  '<div class="c sm">واتساب / موبايل: <span dir="ltr">01501005003</span></div>'+
  '<div class="dash"></div>'+
  '<div class="meta"><span>فاتورة رقم</span><b>#'+(showNo!==null?showNo:invNo())+'</b></div>'+
  '<div class="meta"><span>التاريخ</span><span>'+d+' - '+tm+'</span></div>'+
  '<div class="meta"><span>العميل</span><b>'+esc($('cn').value||'—')+'</b></div>'+
  ($('cp').value?'<div class="meta"><span>تليفون</span><span>'+esc($('cp').value)+'</span></div>':'')+
  '<div class="dash"></div>'+
  '<table><colgroup><col><col style="width:50px"><col style="width:56px"><col style="width:68px"></colgroup>'+
  '<tr class="hd"><th>الصنف</th><th class="n">كمية</th><th class="n">سعر</th><th class="n">إجمالي</th></tr>'+rows+'</table>'+
  '<div class="dash"></div>'+
  '<div class="tot"><div><span>المجموع</span><span>'+fmt(sub)+' ج.م</span></div>'+
  (ds?'<div><span>الخصم</span><span>- '+fmt(ds)+' ج.م</span></div>':'')+
  '<div class="grand"><span>الإجمالي</span><span>'+fmt(total)+' ج.م</span></div>'+
  (pd?'<div><span>المدفوع</span><span>'+fmt(pd)+' ج.م</span></div>':'')+
  (pd?'<div class="rem"><span>'+(rem>0?'المتبقي':'الحالة')+'</span><span>'+(rem>0?fmt(rem)+' ج.م':'مدفوعة بالكامل')+'</span></div>':'')+
  '</div><div class="dash"></div>'+
  '<div class="c" style="font-weight:800">شكرًا لتعاملكم معنا</div>'+
  '<div class="c sm" dir="ltr" style="margin-top:4px">facebook.com/coffeemokato</div>'+
  '<div class="c sm" dir="ltr">www.mokatocoffee.store</div>'+
  '<div class="c sm" dir="ltr" style="margin-top:2px">COFFEE MADE FOR YOUR VIBE</div>'+
  '<div class="bar"></div>';
}

['cn','cp','dt','ds','pd'].forEach(id=>$(id).addEventListener('input',()=>{
  draw();
}));
$('rows').addEventListener('input',draw);
$('add').onclick=()=>{addRow();draw()};

$('make').onclick=async()=>{
  if(!items().length){alert('أضف صنف واحد على الأقل');return}
  if(typeof html2canvas==='undefined'){alert('تعذر تحميل أداة الصورة، تأكد من الاتصال بالإنترنت');return}
  $('make').textContent='جاري عمل الصورة…';
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const c=await html2canvas($('inv'),{scale:3,backgroundColor:'#ffffff'});
    blob=await new Promise(r=>c.toBlob(r,'image/png'));
    $('out').src=c.toDataURL('image/png');
    $('modal').classList.add('on');
    if(showNo===null){saveHist();store.set('mk_no2',String(invNo()));draw();}
  }catch(e){alert('حصلت مشكلة في عمل الصورة، جرب تاني')}
  $('make').textContent='اعمل صورة الفاتورة';
};
$('close').onclick=()=>$('modal').classList.remove('on');
$('share').onclick=async()=>{
  const name='invoice-'+(showNo!==null?showNo:invNo()-1)+'.png',m=$('smsg');
  m.textContent='';
  try{
    const dl=window.claude&&claude.use&&await claude.use('downloads');
    if(dl){await dl.save({filename:name,data:blob});return}
  }catch(e){if(e&&e.code==='declined')return}
  try{
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
    document.body.appendChild(a);a.click();a.remove();
    m.textContent='لو الصورة متحفظتش، اضغط مطولًا عليها واختار حفظ الصورة.';
  }catch(e){m.textContent='اضغط مطولًا على الصورة واختار حفظ الصورة.'}
};
$('share2').onclick=async()=>{
  const m=$('smsg');m.textContent='';
  try{
    const f=new File([blob],'invoice.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}
    m.textContent='المشاركة مش متاحة هنا. اضغط مطولًا على الصورة واختار حفظ الصورة.';
  }catch(e){if(!(e&&e.name==='AbortError'))m.textContent='المشاركة مش متاحة هنا. اضغط مطولًا على الصورة واختار حفظ الصورة.'}
};


let showNo=null,showTm=null;
const getH=()=>{try{return JSON.parse(store.get('mk_hist','[]'))}catch(e){return[]}};
function saveHist(){
  const it=items(),sub=it.reduce((a,i)=>a+i.q*i.p,0),ds=parseFloat($('ds').value)||0;
  const rec={no:invNo(),tm:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),cn:$('cn').value,cp:$('cp').value,dt:$('dt').value,ds:$('ds').value,pd:$('pd').value,it:it,total:Math.max(sub-ds,0)};
  const h=getH();h.unshift(rec);store.set('mk_hist',JSON.stringify(h.slice(0,300)));
}
function renderHist(){
  const h=getH();
  $('histList').innerHTML=h.length?h.map((r,i)=>'<div class="hitem"><div class="meta"><b>#'+r.no+' · '+esc(r.cn||'بدون اسم')+'</b><span>'+fmt(r.total)+' ج.م · '+esc(r.dt||'')+'</span></div><div class="acts"><button data-o="'+i+'">افتح</button><button data-d="'+i+'">حذف</button></div></div>').join(''):'<div class="hempty">لسه مفيش فواتير محفوظة. أول فاتورة تعمل صورتها هتتحفظ هنا.</div>';
}
function showView(h){$('formView').style.display=h?'none':'block';$('histView').style.display=h?'block':'none';window.scrollTo(0,0)}
function openInv(r){
  $('cn').value=r.cn;$('cp').value=r.cp;$('dt').value=r.dt;$('ds').value=r.ds;$('pd').value=r.pd;
  $('rows').innerHTML='';(r.it.length?r.it:[{}]).forEach(i=>addRow(i.n||'',i.r||'',i.q||'',i.p||''));
  showNo=r.no;showTm=r.tm;$('oldNo').textContent=r.no;$('oldBanner').style.display='block';
  draw();showView(false);
}
function newInv(){
  ['cn','cp'].forEach(id=>$(id).value='');$('ds').value=0;$('pd').value=0;
  $('dt').value=new Date().toISOString().slice(0,10);
  $('rows').innerHTML='';addRow();showNo=null;showTm=null;$('oldBanner').style.display='none';draw();
}
$('histBtn').onclick=()=>{renderHist();showView(true)};
$('histClose').onclick=()=>showView(false);
$('newInv').onclick=newInv;
$('histList').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const h=getH();
  if(b.dataset.o!==undefined){openInv(h[b.dataset.o]);return}
  if(b.dataset.d!==undefined){
    if(b.dataset.armed){h.splice(b.dataset.d,1);store.set('mk_hist',JSON.stringify(h));renderHist()}
    else{b.dataset.armed='1';b.textContent='تأكيد الحذف؟'}
  }
});
addRow();
draw();
</script>
</body>
</html>
